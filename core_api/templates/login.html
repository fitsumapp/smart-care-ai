<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Nurse Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-blue: #0056b3; --accent-blue: #0dcaf0; --bg-light: #f8f9fa; }
        body { background: var(--bg-light); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 86, 179, 0.1); width: 100%; max-width: 420px; border-top: 6px solid var(--primary-blue); }
        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-area h2 { font-weight: 800; color: var(--primary-blue); letter-spacing: -1px; }
        .form-label { font-weight: 600; color: #555; }
        .form-control, .form-select { border-radius: 12px; padding: 12px; border: 1px solid #dee2e6; }
        .btn-submit { background: var(--primary-blue); color: white; border: none; border-radius: 12px; padding: 14px; width: 100%; font-weight: 700; transition: 0.3s; margin-top: 20px; }
        .btn-submit:hover { background: #004494; transform: translateY(-2px); }
        .alert { border-radius: 12px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-area">
        <h2>AI NURSE <span style="color: var(--accent-blue);">PRO</span></h2>
        <p class="text-muted">Smart Healthcare Monitoring</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-2">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">System Role</label>
            <select name="role" class="form-select" required>
                <option value="nurse">Nurse Station</option>
                <option value="supervisor">Hospital Supervisor</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-submit">Sign In to Dashboard</button>
    </form>
</div>

</body>
</html>
